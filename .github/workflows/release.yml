name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node tools/build.mjs --check

      - name: Verify the artifact is up to date
        run: |
          if ! git diff --quiet -- LuoguBetter.user.js; then
            echo "::error::LuoguBetter.user.js 与 src/ 不同步，请先本地 npm run build 并提交产物。"
            git --no-pager diff --stat -- LuoguBetter.user.js
            exit 1
          fi

      - name: Parse version
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          IFS='.' read -r major minor patch <<< "$VERSION"
          echo "major=$major" >> $GITHUB_OUTPUT
          echo "minor=$minor" >> $GITHUB_OUTPUT
          echo "patch=$patch" >> $GITHUB_OUTPUT

      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: "Luogu Better! - ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            LuoguBetter.user.js
          prerelease: ${{ steps.version.outputs.patch != '0' }}
